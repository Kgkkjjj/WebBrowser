<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>OpenB Extensions</title>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; margin: 0; }
        header { background: #343a40; color: #fff; padding: 20px; text-align: center; }
        main { padding: 40px; max-width: 800px; margin: auto; }
        a { color: #0069d9; }
    </style>
</head>
<body>
    <header><h1>Extensions</h1></header>
    <main>
        <p>OpenB supports simple JavaScript extensions. Place <code>.js</code> files
        in the <code>extensions</code> directory next to the browser binary
        or under <code>/usr/local/share/openb/extensions</code>. Scripts are
        injected into every page when the browser starts.</p>
        <p>This makes it easy to add custom behaviors or tweak websites.</p>
    </main>
</body>
</html>
