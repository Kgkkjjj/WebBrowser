<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>OpenB Developer Tools</title>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; margin: 0; }
        header { background: #343a40; color: #fff; padding: 20px; text-align: center; }
        main { padding: 40px; max-width: 800px; margin: auto; }
        a { color: #0069d9; }
    </style>
</head>
<body>
    <header><h1>Developer Tools</h1></header>
    <main>
        <p>OpenB includes several tools useful for web developers.</p>
        <ul>
            <li>WebKit Inspector (<kbd>F12</kbd>)</li>
            <li>View Source (<kbd>Ctrl+U</kbd>)</li>
            <li>Zoom In/Out (<kbd>Ctrl++</kbd>/<kbd>Ctrl+-</kbd>)</li>
            <li>Toggle JavaScript (<kbd>Ctrl+J</kbd>)</li>
            <li>Clear Cache (<kbd>F9</kbd>)</li>
            <li>Take Screenshot (<kbd>Ctrl+P</kbd>)</li>
            <li>Manage Extensions (<kbd>Ctrl+E</kbd>)</li>
        </ul>
    </main>
</body>
</html>
