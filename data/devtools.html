<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>OpenB Developer Tools</title>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; margin: 0; }
        header { background: #343a40; color: #fff; padding: 20px; text-align: center; }
        main { padding: 40px; max-width: 800px; margin: auto; }
        a { color: #0069d9; }
    </style>
</head>
<body>
    <header><h1>Developer Tools</h1></header>
    <main>
        <p>OpenB includes several tools useful for web developers.</p>
        <ul>
            <li>WebKit Inspector for examining page HTML, CSS and JavaScript (<kbd>F12</kbd> or the <strong>DevTools</strong> button).</li>
            <li><strong>View Source</strong> (<kbd>Ctrl+U</kbd>) shows the page's raw markup.</li>
            <li><strong>Zoom controls</strong> (<kbd>Ctrl++</kbd> / <kbd>Ctrl+-</kbd>) let you scale the page.</li>
        </ul>
    </main>
</body>
</html>
