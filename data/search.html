<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>OpenB Search</title>
    <style>
        body{font-family:sans-serif;background:#f8f9fa;margin:0;color:#333;}
        header{background:#343a40;color:#fff;padding:20px;text-align:center;}
        #search-box{width:80%;padding:8px;font-size:1.1em;}
        main{padding:20px;max-width:800px;margin:auto;}
        ul{list-style:none;padding:0;}
        li{margin-bottom:10px;}
        a{color:#0069d9;text-decoration:none;}
    </style>
</head>
<body>
    <header>
        <h1>Search Results</h1>
        <input id="search-box" placeholder="Search"/>
    </header>
    <main>
        <ul id="results"></ul>
    </main>
    <script>
    const box=document.getElementById('search-box');
    const list=document.getElementById('results');
    const params=new URLSearchParams(location.search);
    const query=params.get('q')||'';
    box.value=query;

    function showResults(items){
        list.innerHTML='';
        items.forEach(it=>{
            if(it.Text&&it.FirstURL){
                const li=document.createElement('li');
                const a=document.createElement('a');
                a.href=it.FirstURL;
                a.textContent=it.Text;
                li.appendChild(a);
                list.appendChild(li);
            }
        });
    }

    const endpoint = location.protocol === 'file:'
        ? 'http://localhost:8080/search?q='
        : '/search?q=';

    function search(q){
        const url = endpoint + encodeURIComponent(q);
        fetch(url)
            .then(r=>r.json())
            .then(d=>{
                if(Array.isArray(d.RelatedTopics))
                    showResults(d.RelatedTopics);
            });
    }

    box.addEventListener('keydown',e=>{
        if(e.key==='Enter'){
            search(box.value);
        }
    });

    if(query){
        search(query);
    }
    </script>
</body>
</html>
