  <title>OpenB Start Page</title>
  <link rel="stylesheet" href="styles.css">
  </header>
  <nav>
    <a href="downloads.html">Downloads</a>
    <a href="news.html">News</a>
    <a href="devtools.html">DevTools</a>
    <a href="extensions.html">Extensions</a>
    <button id="theme-btn">Toggle Theme</button>
  </nav>
  <main>
    <section id="search-section">
      <input id="search-input" placeholder="Search or enter address"/>
    </section>
    <section class="tiles" id="tiles"></section>
  </main>
  <footer>
    <p>&copy; 2025 OpenB Project</p>
  </footer>
  <script>
    function byId(id){return document.getElementById(id);}
    function openPage(url){window.location.href=url;}
    function applyTheme(){document.body.classList.toggle("dark");}
    function addTile(n,text,url){
      const tile=document.createElement("div");
      tile.className="tile";
      tile.style.backgroundColor=`hsl(${(n*12)%360},60%,90%)`;
      tile.textContent=text;
      tile.addEventListener("click",()=>openPage(url));
      byId("tiles").appendChild(tile);
    document.addEventListener("DOMContentLoaded",()=>{
      const links=[
        ["Info","info.html"],
        ["Downloads","downloads.html"],
        ["News","news.html"],
        ["DevTools","devtools.html"],
        ["Extensions","extensions.html"]
      ];
      for(let i=0;i<30;i++){
        const [text,url]=links[i%links.length];
        addTile(i+1,`${text} ${i+1}`,url);
      }
      byId("theme-btn").addEventListener("click",applyTheme);

      function checkServer(cb){
        const url = location.protocol==='file:' ? 'http://localhost:8080/status' : '/status';
        fetch(url,{method:'GET'}).then(()=>cb(true)).catch(()=>cb(false));
      }

      function submitSearch(q){
        if(q.startsWith('http://')||q.startsWith('https://')){
          window.location.href=q;
          return;
        }
        checkServer(ok=>{
          if(ok){
            let dest='search.html?q='+encodeURIComponent(q);
            if(location.protocol==='file:')
              dest='http://localhost:8080/'+dest;
            window.location.href=dest;
          }else{
            window.location.href='https://duckduckgo.com/?q='+encodeURIComponent(q);
          }
        });
      }

      byId('search-input').addEventListener('keydown',e=>{
        if(e.key==='Enter'){
          const q=e.target.value.trim();
          if(q) submitSearch(q);
        }
      });
    });
  </script>
