<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>OpenB Start Page</title>
    <style>
        body { font-family: sans-serif; background: #f5f5f5; margin: 0; text-align: center; }
        header { background: #353535; color: #fff; padding: 20px; }
        #search-bar { margin-top: 40px; }
        #search-bar input[type="text"] { width: 60%; padding: 10px; font-size: 1.1em; }
        #links { display: flex; justify-content: center; flex-wrap: wrap; margin: 40px; }
        .link-tile { background: #fff; border-radius: 8px; padding: 20px; margin: 10px; width: 120px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .link-tile a { text-decoration: none; color: #333; font-weight: bold; }
    </style>
</head>
<body>
    <header><h1>Welcome to OpenB</h1></header>
    <div id="search-bar">
        <form action="https://duckduckgo.com/" method="GET">
            <input type="text" name="q" placeholder="Search the web">
            <input type="submit" value="Search">
        </form>
    </div>
    <section id="links">
        <div class="link-tile"><a href="file:///downloads/">Downloads</a></div>
        <div class="link-tile"><a href="https://www.example.com">News</a></div>
        <div class="link-tile"><a href="https://github.com">GitHub</a></div>
        <div class="link-tile"><a href="https://www.wikipedia.org">Wikipedia</a></div>
    </section>
</body>
</html>
