<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>OpenB Start Page</title>
    <style>
        body { font-family: sans-serif; background: #e9ecef; margin: 0; }
        header { background: #343a40; color: #fff; padding: 20px; text-align: center; }
        #search { margin: 40px auto; text-align: center; }
        #search input[type="text"] {
            width: 60%;
            max-width: 600px;
            padding: 12px;
            font-size: 1.2em;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #links { display: flex; flex-wrap: wrap; justify-content: center; }
        .tile {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            margin: 10px;
            width: 150px;
            padding: 20px;
            text-align: center;
        }
        .tile a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header><h1>Welcome to OpenB</h1></header>
    <div id="search">
        <form action="https://duckduckgo.com/" method="GET">
            <input type="text" name="q" placeholder="Search the web">
        </form>
    </div>
    <section id="links">
        <div class="tile"><a href="file:///downloads/">Downloads</a></div>
        <div class="tile"><a href="https://www.example.com">News</a></div>
        <div class="tile"><a href="https://github.com">GitHub</a></div>
        <div class="tile"><a href="https://www.wikipedia.org">Wikipedia</a></div>
    </section>
</body>
</html>
